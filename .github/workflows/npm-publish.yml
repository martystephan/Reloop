name: npm-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Publishes every non-private workspace package whose version is not
      # already on the registry. workspace:* deps are rewritten automatically.
      # Auth via OIDC trusted publishing — no token. pnpm exchanges the
      # GitHub id-token for a short-lived npm credential automatically.
      - name: Publish to npm
        run: pnpm publish -r --access public --no-git-checks
